<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <style>
      .srs {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 52px;
        fill: #1a2a4a;
        letter-spacing: 4px;
      }
      .linha {
        stroke: #c9a84c;
        stroke-width: 3;
        stroke-linecap: round;
      }
      .sub {
        font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #1a2a4a;
        letter-spacing: 2px;
      }
      .slogan {
        font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        font-weight: 400;
        font-size: 12px;
        fill: #888888;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      .detalhe {
        fill: #c9a84c;
      }
    </style>
  </defs>

  <!-- Versão Horizontal (Principal) -->
  <g transform="translate(20, 30)">
    <!-- Texto principal SRS -->
    <text x="0" y="50" class="srs">SRS</text>

    <!-- Linha de destaque (dourado) -->
    <line x1="0" y1="65" x2="180" y2="65" class="linha" />

    <!-- Subtexto: Consultoria TI -->
    <text x="0" y="88" class="sub">Consultoria TI</text>

    <!-- Slogan -->
    <text x="0" y="108" class="slogan">Gestão inteligente para brechós</text>
  </g>

  <!-- Ícone Avulso (para favicon/avatar) -->
  <g transform="translate(370, 20)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#1a2a4a" />
    <text x="40" y="52" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="2">SRS</text>
    <circle cx="40" cy="72" r="4" fill="#c9a84c" />
  </g>
</svg>