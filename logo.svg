<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <style>
      .srs {
        font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 52px;
        fill: #1a2a4a;
        letter-spacing: 4px;
      }
      .linha {
        stroke: #c9a84c;
        stroke-width: 3;
        stroke-linecap: round;
      }
      .sub {
        font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #1a2a4a;
        letter-spacing: 2px;
      }
      
    </style>
  </defs>

  <!-- Versão Horizontal (Principal) -->
  <g transform="translate(20, 30)">
    <!-- Texto principal SRS -->
    <text x="10" y="50" class= "srs">SRS</text>

    <!-- Linha de destaque (dourado) -->
    <line x1="0" y1="65" x2="140" y2="65" class="linha" />

    <!-- Subtexto: Consultoria TI -->
    <text x="0" y="88" class="sub">Consultoria TI</text>

    <!-- Slogan -->
    
  </g>

</svg>